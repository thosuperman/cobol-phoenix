name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check phoenix tests
          ruff format --check phoenix tests
      - name: Build GnuCOBOL sandbox image
        run: docker build -t cobol-phoenix-runner:latest runner
      - name: Fetch external COBOL corpus (pinned commits, not committed)
        run: scripts/fetch-corpus.sh
      - name: Tests (incl. differential tests against GnuCOBOL)
        working-directory: backend
        run: python -m pytest tests -p no:warnings -rs
      - name: Validate generated projects
        run: python scripts/validate_generated.py /tmp/phoenix-validate
      - name: Security scan
        working-directory: backend
        run: bandit -q -r phoenix -x phoenix/samples -s B101,B404,B603,B607,B311

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build
