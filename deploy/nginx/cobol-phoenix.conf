# nginx site for COBOL Phoenix behind an existing nginx (see deploy/docker-compose.vps.yml).
# HTTP only at first; once DNS points at this server, run:
#   certbot --nginx -d cobol.beauty -d www.cobol.beauty --redirect
# which adds the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cobol.beauty www.cobol.beauty;

    client_max_body_size 30m;

    # The privacy policy (/privacy) states that the web server keeps no access logs.
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
